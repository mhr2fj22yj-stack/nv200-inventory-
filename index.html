
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<link rel="manifest" href="manifest.json">

<title>Nissan NV200 Inventory</title>

<style>
body{
margin:0;
background:#121212;
color:white;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
padding:15px;
max-width:800px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#999;
margin-bottom:20px;
}

.stats{
display:flex;
gap:10px;
margin-bottom:15px;
}

.card{
flex:1;
padding:15px;
border-radius:12px;
text-align:center;
font-weight:bold;
}

.red{
background:#8b0000;
}

.green{
background:#006400;
}

.controls{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

button{
border:none;
border-radius:12px;
padding:12px;
background:#2b2b2b;
color:white;
font-weight:bold;
cursor:pointer;
}

.item{
background:#1f1f1f;
border-radius:12px;
padding:12px;
margin-bottom:10px;
}

.outside{
border-left:6px solid red;
}

.inside{
border-left:6px solid #17d864;
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:10px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:10px;
border:none;
box-sizing:border-box;
}

.editPanel{
display:none;
background:#222;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.favorite{
color:gold;
font-size:18px;
margin-right:5px;
}

.warning{
background:#4d0000;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.success{
background:#005c1d;
padding:15px;
border-radius:12px;
margin-top:15px;
}
</style>
</head>

<body>

<h1>🚐 Nissan NV200</h1>
<div class="subtitle">Inventory Tracker</div>

<div class="stats">
<div class="card red">
🔴 Out
<br>
<span id="outsideCount">0</span>
</div>

<div class="card green">
🟢 In Vehicle
<br>
<span id="insideCount">0</span>
</div>
</div>

<div class="controls">
<button onclick="toggleEdit()">⚙️ Edit</button>
<button onclick="endWorkday()">🏠 End Workday</button>
<button onclick="exportData()">💾 Backup</button>
<input type="file" id="restore" style="display:none">
<button onclick="document.getElementById('restore').click()">📂 Restore</button>
</div>

<div id="result"></div>

<div class="editPanel" id="editPanel">

<input id="newItem" placeholder="Tool name">

<select id="category">
<option>Fiber</option>
<option>Network</option>
<option>Hand Tools</option>
<option>Testing</option>
<option>Safety</option>
<option>Other</option>
</select>

<button onclick="addItem()">Add Item</button>

</div>

<div id="items"></div>

<script>

if('serviceWorker' in navigator){
navigator.serviceWorker.register('service-worker.js');
}

let items=JSON.parse(localStorage.getItem("nv200"))||[];

function save(){
localStorage.setItem("nv200",JSON.stringify(items));
}

function toggleEdit(){
const p=document.getElementById("editPanel");
p.style.display=p.style.display==="block"?"none":"block";
}

function addItem(){

const name=document.getElementById("newItem").value.trim();

if(!name) return;

items.push({
name:name,
status:"inside",
favorite:false,
category:document.getElementById("category").value,
date:null
});

save();
render();

document.getElementById("newItem").value="";
}

function toggleStatus(i){

if(items[i].status==="inside"){
items[i].status="outside";
items[i].date=new Date().toISOString();
}
else{
items[i].status="inside";
items[i].date=null;
}

save();
render();
}

function toggleFavorite(i){

items[i].favorite=!items[i].favorite;

save();
render();
}

function renameItem(i){

const n=prompt("Edit Name",items[i].name);

if(n){
items[i].name=n;
save();
render();
}
}

function removeItem(i){

if(confirm("Delete this item?")){
items.splice(i,1);
save();
render();
}
}

function moveUp(i){

if(i===0) return;

[items[i],items[i-1]]=[items[i-1],items[i]];
save();
render();
}

function moveDown(i){

if(i===items.length-1)return;

[items[i],items[i+1]]=[items[i+1],items[i]];
save();
render();
}

function render(){

const box=document.getElementById("items");

const sorted=[
...items.filter(x=>x.status==="outside"),
...items.filter(x=>x.status==="inside")
];

box.innerHTML="";

sorted.forEach(item=>{

const i=items.indexOf(item);

box.innerHTML+=`
<div class="item ${item.status}">
<div>
${item.favorite?'<span class="favorite">⭐</span>':''}
<b>${item.name}</b>
</div>

<div>${item.category}</div>

${item.date && item.status==="outside"
? `<small>Taken out: ${new Date(item.date).toLocaleString()}</small>`
: ''}

<div class="actions">

<button onclick="toggleStatus(${i})">
${item.status==="inside"?"Take Out":"Return"}
</button>

<button onclick="toggleFavorite(${i})">
⭐
</button>

<button onclick="renameItem(${i})">
✏️
</button>

<button onclick="moveUp(${i})">
⬆️
</button>

<button onclick="moveDown(${i})">
⬇️
</button>

<button onclick="removeItem(${i})">
🗑️
</button>

</div>
</div>
`;
});

document.getElementById("outsideCount").innerText=
items.filter(x=>x.status==="outside").length;

document.getElementById("insideCount").innerText=
items.filter(x=>x.status==="inside").length;
}

function endWorkday(){

const missing=
items.filter(x=>x.status==="outside");

if(missing.length===0){

document.getElementById("result").innerHTML=
`<div class="success">
✅ Everything is back in the vehicle.
</div>`;

return;
}

let html="<div class='warning'><b>Missing Items</b><br><br>";

missing.forEach(x=>{
html+="🔴 "+x.name+"<br>";
});

html+="</div>";

document.getElementById("result").innerHTML=html;
}

function exportData(){

const blob=new Blob(
[JSON.stringify(items,null,2)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="nv200-backup.json";

a.click();
}

document.getElementById("restore")
.addEventListener("change",e=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(){

items=JSON.parse(reader.result);

save();
render();
};

reader.readAsText(file);

});

render();

</script>

</body>
</html>
